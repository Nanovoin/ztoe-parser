name: Hourly ZTOE Parser

on:
  schedule:
    - cron: '0 * * * *' # Запуск ровно в 00 минут каждого часа
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка библиотек
      run: |
        pip install requests beautifulsoup4

    - name: Запуск парсера
      run: python parser.py

    - name: Сохранение изменений
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add index.html
        
        # Фиксируем изменения, если они есть
        git commit -m "Авто-обновление данных: $(date)" || echo "Нет изменений для коммита"
        
        # Магия защиты от конфликтов: стягиваем чужие правки, автоматически выбирая нашу версию index.html
        git pull --rebase origin main
        
        # Отправляем со стопроцентным успехом
        git push origin main

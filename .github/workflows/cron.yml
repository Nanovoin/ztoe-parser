name: Hourly ZTOE Parser

on:
  schedule:
    - cron: '1,31 * * * *'
  workflow_dispatch:

concurrency:
  group: ztoe-parser
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Настройка Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Установка библиотек
        run: pip install -r requirements.txt

      - name: Запуск парсера
        run: python parser.py

      - name: Сохранение изменений через авто-коммит
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        with:
          commit_message: "Авто-обновление данных Житомироблэнерго (Очередь 3.1)"
          file_pattern: 'index.html'

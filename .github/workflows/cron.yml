name: Hourly ZTOE Parser

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Дает право роботу делать коммиты

    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Скачивает всю историю, чтобы избежать конфликтов дерева Git

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка библиотек
      run: |
        pip install requests beautifulsoup4

    - name: Запуск парсера
      run: python parser.py

    - name: Сохранение изменений через авто-коммит
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Авто-обновление данных Житомироблэнерго (Очередь 3.1)"
        file_pattern: 'index.html' # Робот будет следить и пушить ТОЛЬКО этот файл
        push_options: '--force' # Принудительно затрет старый index.html свежей версией
